name: Chore
description: Tooling, configuration or maintenance work.
labels: [chore]
body:
  - type: markdown
    attributes:
      value: |
        Describe the tooling, configuration or maintenance change and how to tell when it is done.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this needed?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions that define "done".
      placeholder: |
        - [ ] First verifiable condition
        - [ ] Second verifiable condition
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not cover.
    validations:
      required: true
